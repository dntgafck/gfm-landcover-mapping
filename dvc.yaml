stages:
  load_aoi:
    cmd: python -m data_preparation.pipeline.01_aoi
    deps:
      - data_preparation/pipeline/01_aoi.py
      - conf/load_data/params.yaml
      - data/natural-earth/ne_10m_admin_0_countries.geojson
    params:
      - conf/load_data/params.yaml:
        - aoi
    outs:
      - data/aoi.geojson:
          cache: true
          persist: true

  generate_grid:
    cmd: python -m data_preparation.pipeline.02_grid
    deps:
      - data_preparation/pipeline/02_grid.py
      - data_preparation/load_data/processors.py
      - data/aoi.geojson
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - preprocessing
    outs:
      - data/grid.gpkg

  select_tiles:
    cmd: python -m data_preparation.pipeline.03_select_tiles
    deps:
      - data_preparation/pipeline/03_select_tiles.py
      - data_preparation/load_data/processors.py
      - data/grid.gpkg
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - sampling
    outs:
      - data/grid_selected.gpkg:
          cache: true
          persist: true

  download_imagery:
    cmd: python -m data_preparation.pipeline.04_download
    deps:
      - data_preparation/pipeline/04_download.py
      - data_preparation/load_data/loader.py
      - data/grid_selected.gpkg
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - download
        - preprocessing
    outs:
      - data/imagery:
          persist: true

  generate_labels:
    cmd: python -m data_preparation.pipeline.05_label
    deps:
      - data_preparation/pipeline/05_label.py
      - data/imagery
      - data/worldcover/v200/2021/esa_worldcover_grid.geojson
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - labels
        - download
    outs:
      - data/labels:
          persist: true

  06_patchify:
    cmd: python -m data_preparation.pipeline.06_patchify --config conf/patchify/params.yaml
    deps:
      - data_preparation/pipeline/06_patchify.py
      - data_preparation/patchify/io.py
      - data_preparation/patchify/stats.py
      - utils/logging.py
      - data/imagery
      - data/labels
      - conf/patchify/params.yaml
    params:
      - conf/patchify/params.yaml:
        - patch_size
        - stride
        - min_valid_frac
        - max_cloud_frac
        - cloud_scl_codes
        - ignore_label_values
        - compression
        - skip_unusable
    outs:
      - data/patches
