stages:
  load_aoi:
    cmd: python -m data_preparation.pipeline.01_aoi
    deps:
      - data_preparation/pipeline/01_aoi.py
      - conf/params.yaml
      - data/natural-earth/ne_10m_admin_0_countries.geojson
    params:
      - conf/params.yaml:
        - aoi
    outs:
      - data/aoi.geojson:
          cache: true
          persist: true

  generate_grid:
    cmd: python -m data_preparation.pipeline.02_grid
    deps:
      - data_preparation/pipeline/02_grid.py
      - data_preparation/load_data/processors.py
      - data/aoi.geojson
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - preprocessing
    outs:
      - data/grid.gpkg

  select_tiles:
    cmd: python -m data_preparation.pipeline.03_select_tiles
    deps:
      - data_preparation/pipeline/03_select_tiles.py
      - data_preparation/load_data/processors.py
      - data/grid.gpkg
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - sampling
    outs:
      - data/grid_selected.gpkg:
          cache: true
          persist: true

  download_imagery:
    cmd: python -m data_preparation.pipeline.04_download
    deps:
      - data_preparation/pipeline/04_download.py
      - data_preparation/load_data/loader.py
      - data/grid_selected.gpkg
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - download
        - preprocessing
    outs:
      - data/imagery:
          persist: true

  generate_labels:
    cmd: python -m data_preparation.pipeline.05_label
    deps:
      - data_preparation/pipeline/05_label.py
      - data/imagery
      - data/worldcover/v200/2021/esa_worldcover_grid.geojson
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - labels
        - download
    outs:
      - data/labels:
          persist: true

  patchify:
    cmd: python -m data_preparation.pipeline.06_patchify
    deps:
      - data_preparation/pipeline/06_patchify.py
      - data_preparation/patchify/io.py
      - data_preparation/patchify/stats.py
      - utils/logging.py
      - data/imagery
      - data/labels
      - data/aoi.geojson
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - patchify
    outs:
      - data/patches:
          persist: true
      - data/index/dataset_index.csv:
          persist: true

  assign_splits:
    cmd: python -m data_preparation.pipeline.07_assign_splits
    deps:
      - data_preparation/pipeline/07_assign_splits.py
      - data_preparation/index/hash_split.py
      - data/index/dataset_index.csv
      - data/aoi.geojson
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - split
    outs:
      - data/index/dataset_index_with_split.csv
      - data/index/train_index.csv
      - data/index/val_index.csv
      - data/index/test_index.csv
      - data/index/ood_index.csv

  compute_norm_stats:
    cmd: python -m data_preparation.pipeline.08_compute_norm_stats
    deps:
      - data/index/dataset_index_with_split.csv
      - data_preparation/pipeline/08_compute_norm_stats.py
      - conf/params.yaml
    params:
      - conf/params.yaml:
        - norm_stats
    outs:
      - data/stats/norm_stats.json:
          cache: true
