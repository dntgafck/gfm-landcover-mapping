stages:
  load_aoi:
    cmd: python -m scripts.load_data.pipeline.01_aoi
    deps:
      - scripts/load_data/pipeline/01_aoi.py
      - conf/load_data/params.yaml
      - data/worldcover/v200/2021/esa_worldcover_grid.geojson
    params:
      - conf/load_data/params.yaml:
        - aoi
    outs:
      - data/aoi.geojson

  generate_grid:
    cmd: python -m scripts.load_data.pipeline.02_grid
    deps:
      - scripts/load_data/pipeline/02_grid.py
      - data/aoi.geojson
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - preprocessing
    outs:
      - data/grid.geojson

  download:
    cmd: python -m scripts.load_data.pipeline.03_download
    deps:
      - scripts/load_data/pipeline/03_download.py
      - data/grid.geojson
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - download
    outs:
      - data/imagery

  label:
    cmd: python -m scripts.load_data.pipeline.04_label
    deps:
      - scripts/load_data/pipeline/04_label.py
      - data/imagery
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - labels
    outs:
      - data/labels
