stages:
  load_aoi:
    cmd: python -m scripts.load_data.pipeline.01_aoi
    deps:
      - scripts/load_data/pipeline/01_aoi.py
      - conf/load_data/params.yaml
      - data/natural-earth/ne_10m_admin_0_countries.geojson
    params:
      - conf/load_data/params.yaml:
        - aoi
    outs:
      - data/aoi.geojson:
          cache: true
          persist: true

  generate_grid:
    cmd: python -m scripts.load_data.pipeline.02_grid
    deps:
      - scripts/load_data/pipeline/02_grid.py
      - scripts/load_data/processors.py
      - data/aoi.geojson
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - preprocessing
    outs:
      - data/grid.gpkg

  select_tiles:
    cmd: python -m scripts.load_data.pipeline.03_select_tiles
    deps:
      - scripts/load_data/pipeline/03_select_tiles.py
      - scripts/load_data/processors.py
      - data/grid.gpkg
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - sampling
    outs:
      - data/grid_selected.gpkg:
          cache: true
          persist: true

  download_imagery:
    cmd: python -m scripts.load_data.pipeline.04_download
    deps:
      - scripts/load_data/pipeline/04_download.py
      - scripts/load_data/loader.py
      - data/grid_selected.gpkg
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - download
        - preprocessing
    outs:
      - data/imagery:
          persist: true

  generate_labels:
    cmd: python -m scripts.load_data.pipeline.05_label
    deps:
      - scripts/load_data/pipeline/05_label.py
      - data/imagery
      - data/worldcover/v200/2021/esa_worldcover_grid.geojson
      - conf/load_data/params.yaml
    params:
      - conf/load_data/params.yaml:
        - labels
        - download
    outs:
      - data/labels:
          persist: true
