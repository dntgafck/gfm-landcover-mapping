[workspace]
authors = ["Anton Ustinov <ustinov.ant@gmail.com>"]
channels = ["conda-forge"]
name = "gfm-landcover-mapping"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
pip = "*"
rasterio = "*"
gdal = "*"
proj = "*"
geos = "*"
fiona = "*"
shapely = "*"
pyproj = "*"
ipykernel = "*"
jupyterlab = "*"
numpy = ">=2.4.0,<3"

[pypi-dependencies]
sentinelhub = ">=3.11.3, <4"
requests = "*"
pandas = ">=2.3.3, <3"
matplotlib = ">=3.10.8, <4"
click = "*"
geopandas = ">=1.1.2, <2"
requests-oauthlib = ">=2.0.0, <3"
boto3 = ">=1.42.16, <2"

[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"
mypy = "*"
types-requests = "*"
pytest = "*"
dvc = "*"
dvc-gdrive = "*"
jupyterlab = "*"
seaborn = ">=0.13.2, <0.14"

[feature.dev.tasks]
lint-all = "pre-commit run --all-files"
test = "pytest"
lab = "jupyter lab"

[environments]
dev = ["dev"]
