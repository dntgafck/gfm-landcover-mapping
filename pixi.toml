[workspace]
authors = ["Anton Ustinov <ustinov.ant@gmail.com>"]
channels = ["conda-forge"]
name = "gfm-landcover-mapping"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
lint-all = "pre-commit run --all-files"
test = "pytest"
lab = "jupyter lab"

[dependencies]
# Core runtime
python = "3.11.*"
pip = "*"

# Compiled geospatial stack (conda-forge)
gdal = "*"
rasterio = "*"
fiona = "*"
proj = "*"
geos = "*"
pyproj = "*"
shapely = "*"

# Numerical / notebooks
numpy = ">=2.4.0,<3"
ipykernel = "*"
jupyterlab = "*"

[system-requirements]
# Keep broad; Linux GPU nodes satisfy this, macOS ignores it
cuda = "12"

[target.linux-64.dependencies]
# PyTorch GPU for Linux
pytorch-gpu = ">=2.9.1,<3"
cuda-version = "12.9.*"
torchvision = ">=0.24.1,<0.25"

[target.osx-arm64.dependencies]
# PyTorch for macOS (MPS)
pytorch = ">=2.9.1,<3"
torchvision = ">=0.24.1,<0.25"

[pypi-dependencies]
# Core libraries
sentinelhub = ">=3.11.3, <4"
requests = "*"
requests-oauthlib = ">=2.0.0, <3"
click = "*"
boto3 = "*"

# Data / viz
pandas = ">=2.3.3, <3"
matplotlib = ">=3.10.8, <4"
geopandas = ">=1.1.2, <2"

# Data management (dev/ops)
dvc = { version = ">=3.65.0, <4", extras = ["s3"] }

# CLI / config / training framework
fire = "*"
hydra-core = ">=1.3.2, <2"
pytorch-lightning = ">=2.6.0, <3"
torchmetrics = ">=1.8.2, <2"
mlflow = "*"

# Model export / tooling
onnx = "*"
onnxscript = ">=0.1.0"

# Inference server
fastapi = ">=0.115.0"
uvicorn = ">=0.34.0"
onnxruntime = ">=1.19.0"
python-multipart = ">=0.0.20"
pillow = ">=10.0.0"

[feature.dev.pypi-dependencies]
# Development tools
pre-commit = "*"
pytest = "*"
seaborn = ">=0.13.2, <0.14"

[target.linux-64.pypi-dependencies]
# GPU inference via ONNX Runtime TensorRT provider
# Install onnxruntime-gpu to enable CUDAExecutionProvider and TensorrtExecutionProvider
onnxruntime-gpu = ">=1.19.0"

[environments]
# Default is your main runtime env
default = []
# Dev adds tools on top
dev = ["dev"]
