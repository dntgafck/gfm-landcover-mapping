early_stopping:
  monitor: "val/mIoU"
  patience: 10
  mode: "max"

model_checkpoint:
  monitor: "val/mIoU"
  save_top_k: 1
  save_last: true
  mode: "max"
  # Stable filename without metric formatting (avoids path issues)
  filename: "best"

# Note: plots.output_dir is set programmatically to run_dir/artifacts/plots
plots:
  enabled: true
