# Export configuration for ONNX and TensorRT models

# Base export settings
enabled: true
onnx_filename: "model.onnx"
checkpoint: "best" # "best" or "last"

# TensorRT conversion configuration
tensorrt:
  enabled: false # Enable TensorRT engine conversion
  precision: "fp16" # Options: "fp32", "fp16", "int8"
  max_batch_size: 1 # Maximum batch size for optimization
  workspace_size: 1073741824 # Workspace size in bytes (1GB)
  use_fp16: true # Use FP16 precision for better performance
  engine_filename: "model.engine" # Output TensorRT engine filename
  verbose: false # Enable verbose logging for TensorRT
