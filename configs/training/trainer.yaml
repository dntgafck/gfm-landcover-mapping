max_epochs: 50
accelerator: "auto"
devices: 1
precision: "32-true"
log_every_n_steps: 10
deterministic: false

# Run directory configuration
# Note: run_dir is created programmatically with structure:
#   runs/{run_id}/config/, logs/, checkpoints/, artifacts/, export/
runs_root: "runs"

# Export configuration (paths set relative to run_dir/export/)
export:
  enabled: true
  onnx_filename: "model.onnx"
