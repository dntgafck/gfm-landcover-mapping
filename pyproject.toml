# pyproject.toml

[project]
name = "gfm-landcover-mapping"
version = "0.1.0"
description = "Land-cover mapping with foundation models"
readme = "README.md"
requires-python = ">=3.11"

# Base runtime dependencies
# Note: GDAL, rasterio, fiona, pytorch, torchvision must be installed via conda
dependencies = [
    # Core libraries
    "sentinelhub>=3.11.3,<4",
    "requests",
    "pandas>=2.3.3,<3",
    "matplotlib>=3.10.8,<4",
    "geopandas>=1.1.2,<2",
    "boto3",
    # ML framework
    "hydra-core>=1.3.2,<2",
    "pytorch-lightning>=2.6.0,<3",
    "torchmetrics>=1.8.2,<2",
    "mlflow",
]

[project.optional-dependencies]
# Development tools
dev = [
    "pre-commit",
    "pytest",
    "jupyterlab",
    "seaborn>=0.13.2,<0.14",
    "ipykernel",
    "dvc[s3]>=3.65.0,<4",
]

# Training dependencies
train = [
    "onnx",
    "onnxscript>=0.1.0",
]

# GPU training dependencies (Linux-only)
train-gpu = [
    "onnx",
    "onnxscript>=0.1.0",
    "tensorrt; sys_platform == 'linux'",
    "torch-tensorrt; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["landcover*", "data_preparation*", "utils*"]

# --- TOOL CONFIGURATION ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.isort]
profile = "black"
line_length = 100
