# pyproject.toml

[project]
name = "gfm-landcover-mapping"
version = "0.1.0"
description = "Land-cover mapping with foundation models"
readme = "README.md"
requires-python = ">=3.11"
# Dependencies are now managed by pixi.toml
dependencies = []

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

# --- TOOL CONFIGURATION (Keep all of this!) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
[tool.isort]
profile = "black"
line_length = 100
